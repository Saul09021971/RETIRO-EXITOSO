                Object.keys(data).forEach(key => formData.append(key, data[key]));

                    method: 'POST',
                    mode: 'no-cors',
                    credentials: 'omit',
                    body: formData
                }).catch(console.error);

        // --- 1. CALCULADORA DE RETIRO ---
        function RetirementCalculator({ sharedAge, setSharedAge, sharedAhorro, setSharedAhorro, colors, waNumber, sendToGoogleSheets }) {
            // (Lógica mantenida igual)
            const currentAge = sharedAge;
            const setCurrentAge = setSharedAge;
            const monthlySave = sharedAhorro;
            const setMonthlySave = setSharedAhorro;
            const [nombre, setNombre] = useState('');
            const [telefono, setTelefono] = useState('');
            const [email, setEmail] = useState('');
            const [visualizeAge, setVisualizeAge] = useState(65);
            const [isCalculated, setIsCalculated] = useState(false);

            const [results, setResults] = useState({ totalAhorrado: 0, ahorroFiscal: 0, fondoTotal: 0, sumaAsegurada: 0, visualAhorrado: 0, visualFondo: 0 });

            useEffect(() => {
                if (visualizeAge < currentAge) setVisualizeAge(currentAge);
            }, [currentAge]);

            useEffect(() => {
                const yearsTo65 = Math.max(65 - currentAge, 0);
                const mosTo65 = yearsTo65 * 12;
                const tasaMensual = 0.08 / 12;

                const totalAhorrado = monthlySave * mosTo65;
                const ahorroFiscal = (monthlySave * 12) * 0.30;
                const fondoTotal = mosTo65 > 0 ? monthlySave * ((Math.pow(1 + tasaMensual, mosTo65) - 1) / tasaMensual) : 0;
                const sumaAsegurada = monthlySave * 746;

                const yearsVisual = Math.max(visualizeAge - currentAge, 0);
                const mosVisual = yearsVisual * 12;
                const visualAhorrado = monthlySave * mosVisual;
                const visualFondo = mosVisual > 0 ? monthlySave * ((Math.pow(1 + tasaMensual, mosVisual) - 1) / tasaMensual) : 0;

                setResults({ totalAhorrado, ahorroFiscal, fondoTotal, sumaAsegurada, visualAhorrado, visualFondo });
            }, [currentAge, monthlySave, visualizeAge]);

            const format = (v) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(v);
            const showVal = (val) => isCalculated ? format(val) : format(0);

            const handleFormSubmit = (e) => {
                const phoneRegex = /^\d{10}$/;
                const repeatRegex = /^(\d)\1{9}$/;
                
                if (!nombre || !email || !telefono) {
                    e.preventDefault();
                    alert("Por favor completa todos los campos (Nombre, Email y Teléfono) para ver tu proyección.");
                    return;
                }
                
                if (!phoneRegex.test(telefono) || repeatRegex.test(telefono)) {
                    e.preventDefault();
                    alert("Por favor ingresa un Teléfono válido de 10 dígitos reales.");
                    return;
                }
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    e.preventDefault();
                    alert("Por favor ingresa un Correo Electrónico válido.");
                    return;
                }

                setIsCalculated(true);
            };

                window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
            };

            const maxVal = results.fondoTotal > 0 ? results.fondoTotal : 1;
            const tradPct = isCalculated ? ((results.visualAhorrado / maxVal) * 100).toFixed(1) : 0;
            const pprPct = isCalculated ? ((results.visualFondo / maxVal) * 100).toFixed(1) : 0;
            const extraCapital = isCalculated ? (results.fondoTotal - results.totalAhorrado) : 0;

            return (

                            </div>
                            <form action="https://formsubmit.co/gerenciaasconsultores@gmail.com" method="POST" target="_blank" onSubmit={handleFormSubmit} className="flex-grow flex flex-col">

                                <div className="text-center sm:text-left">
                                    <h3 className="text-xs font-black tracking-widest uppercase mb-2" style={{ color: colors.acento }}>Conóceme</h3>
                                    <h2 className="text-3xl sm:text-4xl lg:text-5xl font-black leading-tight mb-4" style={{ color: colors.primario }}>¿Quién es<br/>{CONFIG.nombreLargo}?</h2>
                                    <p className="text-lg lg:text-xl font-medium text-gray-500 mb-6">{CONFIG.titulo}</p>
                                </div>
                            </div>

                            <div className="w-full h-px my-8 bg-gray-200"></div>

                            <p className="text-[16px] lg:text-[18px] text-gray-700 mb-6 leading-relaxed">{CONFIG.historia}</p>
                            <div className="border-l-4 pl-6 my-8 py-4 bg-white/60 rounded-r-xl shadow-sm" style={{ borderColor: colors.secundario }}>
                                <p className="text-[17px] lg:text-[19px] font-bold italic leading-relaxed" style={{ color: colors.primario }}>
                                    "{CONFIG.citaDestacada}"
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
