                const sheetsWebhook = "https://script.google.com/macros/s/AKfycbxWmC5mGn-k1xvaImK_KvUYzt72oh_HLqNVHO4yIaW2uCedYNbCLoRmeeg_NSTX4aLN2A/exec";
                const params = new URLSearchParams(data).toString();

                fetch(`${sheetsWebhook}?${params}`, {
                    method: 'POST',
                    mode: 'no-cors',
                    credentials: 'omit',
                    body: new URLSearchParams(data)
                }).catch(err => console.error("Google Sheets error:", err));

                // 2. Envío a FormSubmit (Formulario nativo apuntado a Iframe oculto para saltarse CORS)
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'https://formsubmit.co/gerenciaasconsultores@gmail.com';
                form.target = 'hidden_iframe';

                const fields = {
                    Nombre: data.nombre,
                    Email: data.email,
                    Telefono: data.telefono,
                    Edad: data.edad,
                    AhorroMensual: data.ahorroMensual,
                    FondoProyectado: data.fondoProyectado,
                    _subject: `Nuevo Prospecto: ${data.nombre} (Simulador de Retiro)`,
                    _captcha: 'false'
                };

                Object.keys(fields).forEach(key => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                });

                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);

                                    </div>
                                </div>

                                {/* TEXTO BIOGRAFÍA (Derecha) */}
                                <div className="w-full lg:w-1/2 flex flex-col justify-center text-left">
                                    <span className="text-corp-blue font-black tracking-widest text-xs uppercase mb-2">Mi Vocación</span>
                                    <h2 className="text-3xl sm:text-4xl font-black text-white leading-tight mb-6">¿Quién es Saúl Alatorre?</h2>

                                    <div className="w-16 h-1.5 bg-corp-blue mb-8 rounded-full"></div>

                                    <p className="text-base text-gray-300 mb-5 leading-relaxed">
                                        Soy Saúl Alatorre, mi vocación es proteger lo que más amas y valoras. Entiendo profundamente que una de las prioridades de las personas es asegurar el futuro, brindarle tranquilidad y la calidad de vida a la familia, garantizar el ingreso y blindar el patrimonio de su negocio.
                                    </p>
                                    <p className="text-base text-gray-300 mb-6 leading-relaxed">
                                        Más que ofrecer un instrumento financiero convencional, me dedico a escuchar tus metas personales para diseñar estrategias sólidas a tu medida. Como <strong>El Rey del Retiro</strong>, mi objetivo no es asustarte con el futuro, sino darte las herramientas matemáticas para dominarlo.
                                    </p>

                                    <div className="border-l-4 border-corp-blue pl-6 my-6 py-2 bg-white/5 rounded-r-2xl">

                                            "Mi compromiso, mi lealtad y mi filosofía de trabajo se resumen en un principio muy claro: <span className="text-corp-blue">No represento a una compañía, te represento a ti.</span>"
                                        </p>
                                    </div>

                                        <Calendar size={18} /> COTIZA TU PLAN
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* 3. SECCIÓN NUESTROS PLANES */}
                        <section id="planes" className="w-full py-24 px-4 sm:px-6 md:px-8 bg-corp-navy relative">
                            <div className="max-w-6xl mx-auto text-center">
                                <span className="text-corp-blue font-black tracking-widest text-xs uppercase mb-2 block">Portafolio Especializado</span>
                                <h2 className="text-3xl sm:text-4xl font-black text-white leading-tight mb-4">Estrategias Patrimoniales a tu Medida</h2>
                                <p className="text-base text-gray-300 max-w-2xl mx-auto mb-16 leading-relaxed">
                                    Haz clic en cualquiera de nuestras soluciones especializadas para visualizar en detalle sus beneficios y estructurar tu camino al éxito financiero.
                                </p>

                                {/* GRID DE PLANES */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {Object.keys(planesInfo).map(key => {
                                        const plan = planesInfo[key];
                                        // Definición del icono correspondiente
                                        let planIcon = <Shield className="w-8 h-8 text-corp-blue" />;
                                        if (key === 'retiro') planIcon = <Briefcase className="w-8 h-8 text-corp-blue" />;
                                        if (key === 'segubeca') planIcon = <GraduationCap className="w-8 h-8 text-corp-blue" />;
                                        if (key === 'gastos_medicos') planIcon = <Activity className="w-8 h-8 text-corp-blue" />;
                                        if (key === 'pensiones_imss') planIcon = <Shield className="w-8 h-8 text-corp-blue" />;
                                        if (key === 'vida_mujer') planIcon = <Heart className="w-8 h-8 text-corp-blue" />;

                                        return (
                                            <div key={key} onClick={() => setSelectedPlan(key)} className="bg-slate-900 border border-white/5 rounded-3xl overflow-hidden hover:scale-105 hover:border-corp-blue/40 shadow-xl transition-all cursor-pointer flex flex-col h-full group">
                                                <div className="h-48 overflow-hidden relative">
                                                    <img src={plan.img} alt={plan.title} className="w-full h-full object-cover select-none group-hover:scale-110 transition-transform duration-500" />
                                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
                                                </div>
                                                <div className="p-6 flex-grow flex flex-col items-start text-left">
                                                    <div className="flex items-center gap-2 mb-3">
                                                        {planIcon}
                                                        <h3 className="text-xl font-bold text-white">{plan.title}</h3>
                                                    </div>
                                                    <p className="text-sm text-gray-300 leading-relaxed flex-grow">
                                                        {plan.subtitle}
                                                    </p>
                                                    <span className="text-xs text-corp-blue font-bold tracking-widest uppercase mt-6 flex items-center gap-1 group-hover:underline">
                                                        Ver Detalles <ArrowRight size={12} />
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </section>

                        {/* MODAL DETALLE DE PLANES */}
                        {selectedPlan && (() => {
                            const plan = planesInfo[selectedPlan];
                            const modalWaLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(`Hola Saúl, estuve revisando tu página web y me interesa recibir información detallada sobre el plan: ${plan.title}. ¿Podemos agendar una asesoría?`)}`;
                            return (
                                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setSelectedPlan(null)}>
                                    <div className="bg-slate-900 border border-white/10 rounded-[2rem] w-full max-w-4xl max-h-[90vh] overflow-y-auto flex flex-col shadow-2xl relative scroll-smooth fade-in" onClick={e => e.stopPropagation()}>
                                        {/* Botón Cerrar */}
                                        <button onClick={() => setSelectedPlan(null)} className="absolute top-6 right-6 z-10 p-2 bg-slate-950/80 hover:bg-slate-950 border border-white/10 rounded-full text-white transition-colors">
                                            <XIcon size={20} />
                                        </button>

                                        {/* Imagen y Titulo */}
                                        <div className="w-full h-64 md:h-80 relative overflow-hidden">
                                            <img src={plan.img} alt={plan.title} className="w-full h-full object-cover select-none" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent"></div>
                                            <div className="absolute bottom-6 left-6 md:bottom-8 md:left-8 right-6">
                                                <h3 className="text-2xl md:text-4xl font-black text-white mb-2">{plan.title}</h3>
                                                <p className="text-sm md:text-lg font-medium text-corp-blue">{plan.subtitle}</p>
                                            </div>
                                        </div>

                                        {/* Contenido */}
                                        <div className="p-6 md:p-10 flex flex-col md:flex-row gap-8">
                                            <div className="w-full md:w-3/5 text-left">
                                                <h4 className="text-xs font-black tracking-widest text-corp-blue uppercase mb-3">Descripción del Plan</h4>
                                                <p className="text-base text-gray-300 leading-relaxed mb-6">
                                                    {plan.desc}
                                                </p>
                                                <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                                    <a href={modalWaLink} target="_blank" rel="noopener noreferrer" className="flex-1 flex items-center justify-center gap-2 py-4 bg-green-500 hover:bg-green-600 rounded-xl font-bold text-sm uppercase tracking-wide transition-all shadow-md">
                                                        <MessageCircle size={18} /> Cotizar por WhatsApp
                                                    </a>
                                                    <a href="https://calendly.com/app/scheduling/meeting_types/user/me" target="_blank" rel="noopener noreferrer" className="flex-1 flex items-center justify-center gap-2 py-4 bg-corp-blue hover:bg-sky-600 rounded-xl font-bold text-sm uppercase tracking-wide transition-all shadow-md">
                                                        <Calendar size={18} /> Agendar Asesoría
                                                    </a>
                                                </div>
                                            </div>

                                            {/* Beneficios */}
                                            <div className="w-full md:w-2/5 text-left border-t md:border-t-0 md:border-l border-white/10 pt-6 md:pt-0 md:pl-8">
                                                <h4 className="text-xs font-black tracking-widest text-corp-blue uppercase mb-4">¿Qué incluye tu plan?</h4>
                                                <ul className="space-y-3">
                                                    {plan.benefits.map((benefit, index) => (
                                                        <li key={index} className="flex items-start gap-2.5 text-sm text-gray-300">
                                                            <CheckCircle size={18} className="text-green-500 shrink-0 mt-0.5" />
                                                            <span className="leading-snug">{benefit}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* El simulador ha sido integrado directamente en el Hero en primer plano */}

                        {/* 5. SECCIÓN CALCULADORA FISCAL ISR */}
                        <section id="fiscal" className="w-full bg-slate-50 py-24 px-4 sm:px-6 md:px-8 relative z-20">
                            <IsrCalculator colors={colors} waNumber={waNumber} />
                        </section>

                    </main>

        // --- SUB-COMPONENTE: CALCULADORA DE RETIRO ("Calcula aquí tu retiro") ---
        function RetirementCalculator({ colors, waNumber, sendLeadData, scrollToSection }) {
            const [age, setAge] = useState(35);
            const [ahorro, setAhorro] = useState(3000);

            // Estados para el Lead
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [telefono, setTelefono] = useState('');

            // Control de Visibilidad y Estado de Cálculo
            const [showForm, setShowForm] = useState(false);
            const [isCalculated, setIsCalculated] = useState(false);

            // Gráfica Interactiva
            const [visualizeAge, setVisualizeAge] = useState(65);
            const [results, setResults] = useState({ totalAhorrado: 0, ahorroFiscal: 0, fondoTotal: 0, sumaAsegurada: 0, visualAhorrado: 0, visualFondo: 0 });

            // Sincronizar edad de visualización
            useEffect(() => {
                if (visualizeAge < age) setVisualizeAge(age);
            }, [age]);

            // Efecto para calcular la proyección actuarial
            useEffect(() => {
                const yearsTo65 = Math.max(65 - age, 0);
                const mosTo65 = yearsTo65 * 12;
                const tasaMensual = 0.08 / 12;

                const totalAhorrado = ahorro * mosTo65;
                const ahorroFiscal = (ahorro * 12) * 0.30;
                const fondoTotal = mosTo65 > 0 ? ahorro * ((Math.pow(1 + tasaMensual, mosTo65) - 1) / tasaMensual) : 0;
                const sumaAsegurada = ahorro * 746;

                // Visualización dinámica según slider
                const yearsVisual = Math.max(visualizeAge - age, 0);
                const mosVisual = yearsVisual * 12;
                const visualAhorrado = ahorro * mosVisual;
                const visualFondo = mosVisual > 0 ? ahorro * ((Math.pow(1 + tasaMensual, mosVisual) - 1) / tasaMensual) : 0;

                    return;
                }

                // 3. Activar cálculo e iniciar envíos
                setIsCalculated(true);

                    fecha: new Date().toLocaleDateString(),

                };

                        />

                        <div className="relative z-10 w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            {/* TEXTOS PRINCIPALES (Izquierda) */}
                            <div className="lg:col-span-7 flex flex-col justify-center">
                                <span className="text-corp-blue font-black tracking-widest text-xs sm:text-sm uppercase mb-3">Asesoría Patrimonial de Excelencia</span>
                                <h1 className="text-4xl sm:text-5xl xl:text-6xl font-black text-white leading-tight mb-6">
                                    TU FUTURO FINANCIERO<br />
                                    <span className="text-corp-blue">EMPIEZA HOY.</span>
                                </h1>
                                <p className="text-base sm:text-lg xl:text-xl text-gray-300 leading-relaxed mb-8 max-w-2xl">
                                    Especialista en Retiro Solvente, PPR, Modalidad 40, Estrategias Fiscales Inteligentes, Gastos Médicos Mayores y Protección Patrimonial. Diseñando el blindaje ideal para ti.
                                </p>
                                <div className="flex flex-wrap items-center gap-4">
                                    <button onClick={() => {
                                        const el = document.getElementById('calculator-inputs');
                                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                                        const nameEl = document.getElementById('nombre-input');
                                        if (nameEl && showForm) nameEl.focus();
                                    }} className="inline-flex items-center justify-center px-8 py-4 rounded-full text-white font-bold text-sm sm:text-base shadow-xl hover:bg-sky-600 hover:scale-105 transition-all bg-corp-blue">
                                        <TrendingUp size={20} className="mr-2" /> CALCULA TU RETIRO
                                    </button>
                                    <button onClick={() => scrollToSection('acerca_de')} className="inline-flex items-center justify-center px-8 py-4 rounded-full bg-white/10 text-white font-bold text-sm sm:text-base shadow-lg hover:bg-white/20 hover:scale-105 transition-all border border-white/20 backdrop-blur-sm">
                                        <InfoIcon size={20} className="mr-2" /> CONÓCEME MÁS
                                    </button>
                                </div>
                            </div>

                            {/* PANEL DE CONFIGURACIÓN Y CAPTURA (Derecha) */}
                            <div id="calculator-inputs" className="lg:col-span-5 flex items-center justify-center w-full scroll-mt-24">
                                <div className="w-full bg-slate-900/90 border border-white/10 p-6 sm:p-8 rounded-3xl shadow-2xl relative z-20">
                                    <div className="flex items-center gap-2 mb-6 pb-4 border-b border-white/5">
                                        <TrendingUp size={20} className="text-corp-blue" />
                                        <h3 className="text-lg font-bold text-white uppercase tracking-wider">Simulador de Retiro</h3>
                                    </div>

                                    <form onSubmit={handleCalculateClick} className="space-y-6">
                                        {/* Sliders de Edad y Ahorro */}
                                        <div className="p-4 bg-slate-950 rounded-2xl border border-white/5">
                                            <div className="flex justify-between items-center mb-3">
                                                <label className="text-sm font-bold text-gray-300">Edad Actual:</label>
                                                <span className="text-base font-black text-corp-blue">{age} años</span>
                                            </div>
                                            <input type="range" min="18" max="60" value={age} onChange={(e) => setAge(Number(e.target.value))} className="w-full accent-corp-blue h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer" />
                                        </div>

                                        <div className="p-4 bg-slate-950 rounded-2xl border border-white/5">
                                            <div className="flex justify-between items-center mb-3">
                                                <label className="text-sm font-bold text-gray-300">Ahorro Mensual:</label>
                                                <span className="text-base font-black text-corp-blue">{format(ahorro)}</span>
                                            </div>
                                            <input type="range" min="1000" max="50000" step="500" value={ahorro} onChange={(e) => setAhorro(Number(e.target.value))} className="w-full accent-corp-blue h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer" />
                                        </div>

                                        {/* Formulario Desplegable de Leads */}
                                        {showForm && (
                                            <div className="space-y-4 pt-4 border-t border-white/5 fade-in">
                                                <div className="bg-red-500/10 text-corp-blue text-[11px] font-bold p-3 text-center rounded-xl border border-corp-blue/20">
                                                    Completa tus datos para ver tu proyección completa
                                                </div>

                                                <div className="group text-left">
                                                    <label className="text-xs font-bold text-gray-400 block mb-1">Nombre Completo *</label>
                                                    <input id="nombre-input" type="text" name="name" autoComplete="name" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Ej. Juan Pérez" className="w-full px-4 py-2.5 bg-slate-950 border border-white/10 rounded-xl text-white text-sm outline-none focus:border-corp-blue transition-colors" />
                                                </div>

                                                <div className="group text-left">
                                                    <label className="text-xs font-bold text-gray-400 block mb-1">Correo Electrónico *</label>
                                                    <input type="email" name="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="juan@correo.com" className="w-full px-4 py-2.5 bg-slate-950 border border-white/10 rounded-xl text-white text-sm outline-none focus:border-corp-blue transition-colors" />
                                                </div>

                                                <div className="group text-left">
                                                    <label className="text-xs font-bold text-gray-400 block mb-1">Teléfono Celular *</label>
                                                    <input type="tel" name="tel" autoComplete="tel-national" maxLength="10" value={telefono} onChange={e => setTelefono(e.target.value.replace(/\D/g, ''))} placeholder="10 dígitos" className="w-full px-4 py-2.5 bg-slate-950 border border-white/10 rounded-xl text-white text-sm outline-none focus:border-corp-blue transition-colors" />
                                                </div>
                                            </div>
                                        )}

                                        <button type="submit" className="w-full py-4 rounded-xl text-white font-black text-sm tracking-wider uppercase transition-all transform hover:scale-[1.02] bg-corp-blue hover:bg-sky-600 shadow-lg shadow-corp-blue/20">
                                            {showForm ? "Calcular Proyección" : "Ver Proyección Completa"}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
